services:
  - type: web
    name: lock-in-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://lock-in-mauve.vercel.app/
      # Descomenta y pega tu cadena de Supabase aquí:
      # - key: DATABASE_URL
      #   value: postgresql://postgres.[ref]:[password]@[host].supabase.co:5432/postgres
