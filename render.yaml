services:
  - type: web
    name: lock-in-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://tu-app.vercel.app
      # Uncomment and set if using Postgres
      # - key: DATABASE_URL
      #   value: postgres://user:pass@host:port/dbname
